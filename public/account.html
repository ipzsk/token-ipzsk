<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账户中心 · IPZSK</title><link rel="stylesheet" href="/admin/style.css"><script type="module" src="/account.js"></script></head><body><main class="redeem-main"><span class="brand-symbol">iP</span><h1>账户中心</h1><p class="muted">邮箱验证码登录，管理余额、充值码和 API 凭证。首次验证成功后自动注册。</p><p id="account-notice" class="muted" role="status"></p><article id="email-login" class="card"><form id="email-send-form"><label>邮箱地址<input id="login-email" type="email" autocomplete="email" required maxlength="254" placeholder="你的邮箱"></label><button id="send-otp" class="primary" disabled>发送验证码</button></form><form id="email-verify-form" hidden><label>六位验证码<input name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required></label><p class="footnote">5 分钟内有效，请勿向他人提供验证码。</p><button class="primary">验证并登录</button></form></article><section id="customer-panel" hidden><article class="card"><h2 id="customer-email"></h2><p id="customer-id" class="muted"></p><h2>已入账余额</h2><p id="customer-balance" class="muted"></p><p id="customer-usage" class="muted"></p><button id="customer-refresh" class="secondary">刷新账户</button><button id="customer-logout" class="text-button">退出登录</button></article><article class="card"><h2>兑换充值码</h2><form id="customer-redeem-form"><label>充值码<input name="code" required maxlength="100" autocomplete="off" placeholder="IPZ-…"></label><button class="primary">确认兑换到当前账户</button></form><p class="footnote">当前支持充值入账，调用自动扣减钱包尚未开通。</p></article><article class="card"><h2>我的 API 凭证</h2><p id="customer-token-prefix" class="muted"></p><p class="footnote">Base URL：https://api.ipzsk.com/v1</p><button id="customer-issue-token" class="secondary">生成 API 凭证</button><section id="customer-token-result" hidden><p class="footnote">完整凭证只显示这一次，请妥善保存。</p><textarea id="customer-token" readonly rows="3" aria-label="新生成的 API 凭证"></textarea><button id="customer-copy-token" class="secondary">复制凭证</button></section></article><article class="card"><h2>最近入账</h2><div id="customer-ledger"></div></article></section></main></body></html>
